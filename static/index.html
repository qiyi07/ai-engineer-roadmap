<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 聊天助手 - 多会话</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <h2>会话</h2>
        <button class="new-session-btn" id="new-session-btn">新建会话</button>
        <div class="session-list" id="session-list"></div>
    </div>

    <!-- 主区域 -->
    <div class="main">
        <div class="header">
            <h1>AI 聊天助手</h1>
            <span style="font-size:14px; color:#6b7280;" id="session-title">新对话</span>
        </div>
        <div class="subtitle">基于 DeepSeek · 流式输出 · 多会话</div>

        <div id="chat-box"></div>

        <div class="input-row">
            <input type="text" id="msg-input" placeholder="输入消息..." />
            <button id="send-btn">发送</button>
        </div>
        <div class="status" id="status">就绪</div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>

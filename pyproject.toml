[project]
name = "ai-engineer-roadmap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt==3.2.0",
    "email-validator>=2.3.0",
    "fastapi>=0.139.2",
    "fastapi-mail>=1.6.5",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.1",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "mypy>=2.3.0",
    "openai>=2.49.0",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "redis>=8.0.1",
    "sentence-transformers>=5.6.1",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.39",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.15.22",
]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # E: 错误, F: pyflakes, W: 警告, I: 导入排序
ignore = ["E501"]               # 忽略行过长（因为我们在 line-length 已设）

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
